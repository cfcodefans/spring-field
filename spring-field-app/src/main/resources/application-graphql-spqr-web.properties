### GraphSpqrWebApp (cfcodefans.study.spring_field.graphql.spqr — SPQR runtime schema, no schema.graphqls)
spring.datasource.url=jdbc:hsqldb:mem:graphqlspqr;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Spring for GraphQL is disabled for this profile (see GraphSpqrWebApp excludes).
# POST /graphql — execute queries. GET /graphql/schema — SDL text (SchemaPrinter).
