### GraphQLWebApp (cfcodefans.study.spring_field.graphql.standard — SDL + @QueryMapping)
# Boot 4 resolves each location as "<location>*<extension>" (see GraphQlAutoConfiguration). Use a directory prefix, not **/*.graphqls.
spring.graphql.schema.locations=classpath:graphql/standard/
spring.datasource.url=jdbc:hsqldb:mem:graphqlweb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.graphql.http.path=/graphql
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql/
spring.graphql.schema.printer.enabled=true
